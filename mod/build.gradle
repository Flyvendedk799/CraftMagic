plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Loom adds the Minecraft/Fabric repositories itself; only third-party mod repos go here.
}

loom {
	// Splits client-only code into src/client, which the plugin refuses to let server code
	// reference. That compile-time wall is what keeps a dedicated server from ever loading
	// the hologram renderer.
	splitEnvironmentSourceSets()

	mods {
		"craftmagic" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// Boot straight into a world instead of the main menu:
			//
			//   gradlew runClient -PjoinWorld=JoinTest       (a folder in mod/run/saves)
			//
			// Worth having as a first-class step. Joining a world is its own code path —
			// PlayerList.placeNewPlayer builds the command tree with a synthetic source — and
			// a mod can load, register commands and pass every RCON test while still throwing
			// there, which the client reports as "Invalid player data" and looks like a
			// corrupted save. Only an actual join exercises it.
			if (project.hasProperty('joinWorld')) {
				programArgs '--quickPlaySingleplayer', project.property('joinWorld').toString()
			}
		}
	}
}

// Only the Fabric API modules we actually use, bundled into our jar with `include`
// (Jar-in-Jar). Users install one file instead of two, and if they already run the full
// Fabric API the loader picks whichever version is higher.
//
// `include` is NOT transitive: it bundles exactly the artifact named and nothing it depends
// on. Every module below except the key-mapping one declares `"fabric-api-base": "*"` as a
// hard dependency, so omitting it made the shipped jar refuse to load for anyone who did not
// already have the full Fabric API — while `runClient`/`runServer` worked perfectly, because
// the dev runtime puts all of Fabric API on the classpath. Nothing in this repo's own tests
// could see that; it only shows up in a real install.
//
// If a module is ever added here, check its `depends` block in the built jar and bundle any
// Fabric module it names.
// Verify against the bytecode before adding one, not against what the roadmap intends to use:
//
//   javap -p -c <classes> | grep -oE 'net/fabricmc/fabric/api/[a-zA-Z0-9/]+' | sort -u
//
// This list previously carried three modules for features that were never built (the hologram
// preview and its keybinds). `fabric-rendering-v1` mixes into the client's model pipeline, and
// on 26.2 that mixin died with an IllegalAccessError during the initial resource reload — so
// the client crashed on startup because of a renderer we were not using. Bundling a module is
// not free: every one injects its mixins into the game whether the mod calls it or not.
def fabricApiModules = [
		'fabric-api-base',            // Event — required by both modules below
		'fabric-command-api-v2',      // /craftmagic ...
		'fabric-lifecycle-events-v1', // server start/stop, per-tick block placement
]

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	fabricApiModules.each { moduleName ->
		implementation fabricApi.module(moduleName, project.fabric_api_version)
		include fabricApi.module(moduleName, project.fabric_api_version)
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	// Development-only verification harness; never ship it to players.
	exclude 'dev/craftmagic/agent/tools/**'

	from("../LICENSE") {
		rename { "${it}_craftmagic" }
	}
}

/**
 * Prove a .schem written by packages/core is readable by Minecraft itself, and that every
 * palette entry resolves to a real BlockState. This is the path the builder bot takes, and
 * neither the TypeScript round-trip nor the prismarine-nbt test covers it.
 *
 *   gradlew verifySchematic -Pschem=../out/oak-cottage.schem
 */
tasks.register('verifySchematic', JavaExec) {
	group = 'verification'
	description = 'Read a generated .schem with vanilla NBT and resolve its palette.'
	dependsOn tasks.named('classes')
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'dev.craftmagic.agent.tools.SchematicReadCheck'
	args = [project.findProperty('schem') ?: '../out/oak-cottage.schem']
}

/**
 * Check who may pair a world. A singleplayer player without "Allow Cheats" is permission
 * level 0, so an OP-only gate made the headline feature unreachable for most people — and
 * every automated test ran through RCON, the one source that is always level 4.
 *
 *   gradlew verifyPermissions
 */
tasks.register('verifyPermissions', JavaExec) {
	group = 'verification'
	description = 'Assert the pairing permission policy across singleplayer, LAN and dedicated.'
	dependsOn tasks.named('classes')
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'dev.craftmagic.agent.tools.PermissionPolicyCheck'
}
