# Gradle needs a JDK 25 for Minecraft 26.2.
# When a local path is needed without a system-wide JDK, set JAVA_HOME or
# pass -Dorg.gradle.java.home=... instead of hardcoding a machine-specific path.
org.gradle.java.installations.paths=/openbot-cache/toolchains/jdk/25

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ is not yet fully compatible with the configuration cache (fabric-loom#1349).
org.gradle.configuration-cache=false

# Fabric — check these against https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.158.0+26.2

# Mod
version=0.1.0
group=dev.craftmagic
